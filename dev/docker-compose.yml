services:
  postgresdb:
    image: postgres:18.0-trixie
    container_name: cms_postgresdb
    ports:
      - 127.0.0.1:37602:5432
    volumes:
      - pg_data_cms:/var/lib/postgresql
      - ./postgres-initdb:/docker-entrypoint-initdb.d
    # - /tmp/foo/root/.borgmatic/postgresql_databases/api-db-service/cms:/data/cms
    environment:
      - POSTGRES_DB=cms
      - POSTGRES_USER=cms
      - POSTGRES_PASSWORD=cmspass
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "dbname=cms user=cms"]
      interval: 10s
      timeout: 5s
      retries: 3
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile-api
    container_name: cms_api
    volumes:
      - ../backend/maint-scripts:/app/maint-scripts
      - ../backend/src/cms_backend:/usr/local/lib/python3.13/site-packages/cms_backend
    ports:
      - 127.0.0.1:37601:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/v1/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DEBUG: 1
      WEB_CONCURRENCY: 1
      DATABASE_URL: postgresql+psycopg://cms:cmspass@postgresdb:5432/cms
      ALLOWED_ORIGINS: http://localhost:37600,http://localhost:37603
      OAUTH_JWKS_URI: https://ory.login-staging.kiwix.org/.well-known/jwks.json
      OAUTH_ISSUER: https://ory.login-staging.kiwix.org
      OAUTH_SESSION_AUDIENCE_ID: 309693e7-ad5e-4379-bf93-ba89314230fd
      OAUTH_SESSION_LOGIN_REQUIRE_2FA: true
      CREATE_NEW_OAUTH_ACCOUNT: true
      AUTH_MODES: local
      ALEMBIC_UPGRADE_HEAD_ON_START: true
      JWT_SECRET: DH8kSxcflUVfNRdkEiJJCn2dOOKI3qfw
      INIT_USERNAME: admin
      INIT_PASSWORD: admin_pass
      STAGING_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      STAGING_BASE_PATH: staging
      STAGING_DOWNLOAD_BASE_URL: https://download.staging.acme.org/
      STAGING_VIEW_BASE_URL: https://library.staging.acme.org/viewer#
      QUARANTINE_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      QUARANTINE_BASE_PATH: quarantine
      BACKUP_WAREHOUSE_ID: 44444444-4444-4444-4444-444444444444
      BACKUP_BASE_PATH: backup
      BACKUP_DOWNLOAD_BASE_URL: https://download.backup.acme.org/
      BACKUP_VIEW_BASE_URL: https://library.backup.acme.org/viewer#
      ZIM_UPLOAD_S3_BUCKET_URI: s3+https://s3.us-west-1.wasabisys.com/?keyId=xxxxxxxxxxxxxxxxxxxx&secretAccessKey=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&bucketName=xxxxxxxxxxxxxxxxxx
      ZIMFARM_AUTH_MODE: local
      ZIMFARM_USERNAME: admin
      ZIMFARM_PASSWORD: admin
    command:
      - uvicorn
      - cms_backend.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "80"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --reload
      - --reload-dir
      - /usr/local/lib/python3.13/site-packages/cms_backend
    depends_on:
      postgresdb:
        condition: service_healthy
  mill:
    build:
      context: ../backend
      dockerfile: Dockerfile-mill
    container_name: cms_mill
    volumes:
      - ../backend/maint-scripts:/app/maint-scripts
      - ../backend/src/cms_backend:/usr/local/lib/python3.13/site-packages/cms_backend
    environment:
      DEBUG: 1
      DATABASE_URL: postgresql+psycopg://cms:cmspass@postgresdb:5432/cms
      QUARANTINE_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      QUARANTINE_BASE_PATH: quarantine
      STAGING_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      STAGING_DOWNLOAD_BASE_URL: https://download.staging.acme.org/
      STAGING_VIEW_BASE_URL: https://library.staging.acme.org/viewer#
      STAGING_BASE_PATH: staging
      BACKUP_WAREHOUSE_ID: 44444444-4444-4444-4444-444444444444
      BACKUP_BASE_PATH: backup
      BACKUP_DOWNLOAD_BASE_URL: https://download.backup.acme.org/
      BACKUP_VIEW_BASE_URL: https://library.backup.acme.org/viewer#
    depends_on:
      postgresdb:
        condition: service_healthy
  shuttle:
    build:
      context: ../backend
      dockerfile: Dockerfile-shuttle
    container_name: cms_shuttle
    volumes:
      - ../backend/maint-scripts:/app/maint-scripts
      - ../backend/src/cms_backend:/usr/local/lib/python3.13/site-packages/cms_backend
      - ./scripts:/scripts
      - ./warehouses:/warehouses
      - ./scripts:/scripts
    environment:
      DEBUG: 1
      DATABASE_URL: postgresql+psycopg://cms:cmspass@postgresdb:5432/cms
      LOCAL_WAREHOUSE_PATHS: "11111111-1111-1111-1111-111111111111:/warehouses/dev-hidden,22222222-2222-2222-2222-222222222222:/warehouses/dev-prod,33333333-3333-3333-3333-333333333333:/warehouses/dev-client1,44444444-4444-4444-4444-444444444444:/warehouses/dev-backup,1e9783eb-296e-4cb0-853a-5355a92b2323:/warehouses/download/zim,c6bec3c1-46be-40ff-8bd9-eb789d3b3a22:/warehouses/hidden,dc0ac66e-5f55-4491-b930-aba47abef40f:/warehouses/zim-receiver"
      STAGING_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      STAGING_BASE_PATH: staging
      STAGING_DOWNLOAD_BASE_URL: https://download.staging.acme.org/
      STAGING_VIEW_BASE_URL: https://library.staging.acme.org/viewer#
      QUARANTINE_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      QUARANTINE_BASE_PATH: quarantine
      BACKUP_WAREHOUSE_ID: 44444444-4444-4444-4444-444444444444
      BACKUP_BASE_PATH: backup
      BACKUP_DOWNLOAD_BASE_URL: https://download.backup.acme.org/
      BACKUP_VIEW_BASE_URL: https://library.backup.acme.org/viewer#
      ZIMCHECK_RESULTS_S3_BUCKET_URI: s3+http://minio:9000/?keyId=minio_key&secretAccessKey=minio_secret&bucketName=zimfarm-zimchecks
      ZIM_UPLOAD_S3_BUCKET_URI: s3+https://s3.us-west-1.wasabisys.com/?keyId=xxxxxxxxxxxxxxxxxxxx&secretAccessKey=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx&bucketName=xxxxxxxxxxxxxxxxxx
    depends_on:
      postgresdb:
        condition: service_healthy
      minio:
        condition: service_healthy
  backend-tests:
    build:
      dockerfile: ../dev/backend-tests/Dockerfile
      context: ../backend
    container_name: cms_backend-tests
    command: tail -f /dev/null
    volumes:
      - ../backend/src:/app/src
      - ../backend/tests:/app/tests
    environment:
      DATABASE_URL: postgresql+psycopg://cms:cmspass@postgresdb:5432/cmstest
      ALEMBIC_UPGRADE_HEAD_ON_START: false
      AUTH_MODES: local
      JWT_SECRET: DH8kSxcflUVfNRdkEiJJCn2dOOKI3qfw
      STAGING_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      STAGING_BASE_PATH: staging
      STAGING_DOWNLOAD_BASE_URL: https://download.staging.acme.org/
      STAGING_VIEW_BASE_URL: https://library.staging.acme.org/viewer#
      QUARANTINE_WAREHOUSE_ID: 11111111-1111-1111-1111-111111111111
      QUARANTINE_BASE_PATH: quarantine
      BACKUP_WAREHOUSE_ID: 44444444-4444-4444-4444-444444444444
      BACKUP_BASE_PATH: backup
      BACKUP_DOWNLOAD_BASE_URL: https://download.backup.acme.org/
      BACKUP_VIEW_BASE_URL: https://library.backup.acme.org/viewer#
    depends_on:
      - postgresdb
  frontend:
    build: ../frontend
    container_name: cms_frontend
    volumes:
      - ./frontend-dev/config.json:/usr/share/nginx/html/config.json:ro
    ports:
      - 127.0.0.1:37603:80
    depends_on:
      api:
        condition: service_healthy
  frontend-dev:
    build:
      dockerfile: ../dev/frontend-dev/Dockerfile
      context: ../frontend
    container_name: cms_frontend-dev
    volumes:
      - ../frontend/src:/app/src
      - ./frontend-dev/config.json:/app/public/config.json:ro
    ports:
      - 127.0.0.1:37600:80
    depends_on:
      api:
        condition: service_healthy

  healthcheck:
    build: ../healthcheck
    container_name: cms_healthcheck
    ports:
      - 127.0.0.1:37604:80
    depends_on:
      api:
        condition: service_healthy
    environment:
      CMS_DATABASE_URL: postgresql+psycopg://cms:cmspass@postgresdb:5432/cms
      CMS_FRONTEND_URL: http://frontend
      CMS_USERNAME: cms
      CMS_PASSWORD: cms_pass
      CMS_API_URL: http://api/v1
    volumes:
      - ../healthcheck/src/healthcheck:/usr/local/lib/python3.13/site-packages/healthcheck
    command:
      - uvicorn
      - healthcheck.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "80"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --reload
      - --reload-dir
      - /usr/local/lib/python3.13/site-packages/healthcheck
    profiles:
      - healthcheck

  minio:
    image: minio/minio
    container_name: cms_minio
    ports:
      - 127.0.0.1:37605:9000 # api
      - 127.0.0.1:37606:9001 # web console
    environment:
      - MINIO_ROOT_USER=minio_key
      - MINIO_ROOT_PASSWORD=minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_cms:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  createbuckets:
    image: minio/mc
    container_name: cms_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./contrib/setup-buckets.sh:/setup-buckets.sh
    entrypoint: ["/bin/sh", "/setup-buckets.sh"]

volumes:
  pg_data_cms:
  minio_data_cms:
